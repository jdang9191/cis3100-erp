<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>trading_manifest.json</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: monospace; padding: 20px; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <pre id="json"></pre>
    <script>
        fetch('trading_manifest.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('json').textContent = JSON.stringify(data, null, 2);
            });
    </script>
</body>
</html>
